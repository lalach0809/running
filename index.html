<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>러닝 클럽 - 마라톤 대회 & 훈련 매니저</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #141c2e;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent-neon: #a3e635;
      --accent-coral: #f43f5e;
      --accent-amber: #f59e0b;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #24324f;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 20px 16px; }
    .container { max-width: 860px; margin: 0 auto; }

    /* 상단 헤더 */
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border-color);
    }
    .brand h1 { font-size: 1.45rem; font-weight: 800; color: var(--accent-neon); display: flex; align-items: center; gap: 8px; }
    .brand p { font-size: 0.82rem; color: var(--text-muted); margin-top: 3px; }
    
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .btn-sync {
      background: #1e293b; color: #cbd5e1; border: 1px solid var(--border-color);
      padding: 9px 13px; border-radius: 9999px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    }
    .btn-create {
      background: linear-gradient(135deg, var(--accent-neon), var(--primary));
      color: #052e16; font-weight: 700; font-size: 0.9rem; border: none;
      padding: 9px 16px; border-radius: 9999px; cursor: pointer;
      display: flex; align-items: center; gap: 5px; box-shadow: 0 4px 14px rgba(16,185,129,0.3);
    }

    /* 탭 메뉴 (대회 vs 훈련) */
    .tab-bar {
      display: flex; gap: 10px; margin-bottom: 18px; border-bottom: 2px solid var(--border-color);
    }
    .tab-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 1rem; font-weight: 700; padding: 10px 18px; cursor: pointer;
      position: relative; transition: all 0.2s;
    }
    .tab-btn.active { color: var(--accent-neon); }
    .tab-btn.active::after {
      content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 3px; background: var(--accent-neon); border-radius: 2px;
    }

    /* 상태 바 */
    .sync-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #111a2e; border: 1px solid var(--border-color); border-radius: 8px;
      padding: 8px 14px; margin-bottom: 18px; font-size: 0.82rem; color: var(--text-muted);
    }
    .sync-status { display: flex; align-items: center; gap: 8px; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; }
    .sync-dot.online { background: var(--accent-neon); box-shadow: 0 0 8px var(--accent-neon); }
    .sync-dot.loading { background: var(--accent-amber); animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }

    /* ================= 캘린더 영역 ================= */
    .calendar-container {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: var(--radius); padding: 18px; margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .calendar-title { font-size: 1.25rem; font-weight: 800; color: #fff; }
    .calendar-nav { display: flex; gap: 6px; }
    .calendar-nav button {
      background: #1e293b; color: #cbd5e1; border: 1px solid var(--border-color);
      padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 600;
    }
    .calendar-nav .btn-today { color: var(--accent-neon); border-color: rgba(163,230,53,0.4); }

    .calendar-weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr);
      text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--text-muted);
      margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .weekday.sun { color: var(--accent-coral); }
    .weekday.sat { color: #60a5fa; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-cell {
      min-height: 100px; background: #0e1627; border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; padding: 6px; cursor: pointer; display: flex; flex-direction: column;
      transition: all 0.15s ease; overflow: hidden;
    }
    .cal-cell:hover { background: #18253f; border-color: #3b82f6; }
    .cal-cell.other-month { opacity: 0.25; background: #070c16; }

    .cal-cell.is-today { border: 1.5px solid #38bdf8; }
    .cal-cell.is-today .cell-date { color: #38bdf8; font-weight: 800; }

    .cal-cell.has-events {
      background: linear-gradient(150deg, #12282d, #14233e);
      border: 1.5px solid var(--accent-neon);
      box-shadow: inset 0 0 10px rgba(163, 230, 53, 0.12);
    }
    .cal-cell.has-events .cell-date { color: var(--accent-neon); font-weight: 800; }
    .cal-cell.selected { outline: 2px solid #fff; background: #1c2e4d !important; }

    .cell-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .cell-date { font-size: 0.85rem; font-weight: 600; }
    .cal-cell.sun .cell-date { color: var(--accent-coral); }
    .cal-cell.sat .cell-date { color: #60a5fa; }

    .event-badge-count {
      font-size: 0.65rem; background: var(--accent-neon); color: #052e16;
      font-weight: 800; border-radius: 9999px; padding: 1px 5px;
    }

    .race-chip-list { display: flex; flex-direction: column; gap: 3px; width: 100%; }
    .race-mini-chip {
      background: rgba(16, 185, 129, 0.22);
      border-left: 2.5px solid var(--accent-neon);
      color: #f1f5f9; font-size: 0.68rem; font-weight: 600;
      padding: 3px 4px; border-radius: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: block; width: 100%;
    }

    /* ================= 상세 리스트 영역 ================= */
    .selected-date-header {
      display: flex; justify-content: space-between; align-items: center;
      margin: 24px 0 14px;
    }
    .selected-date-title { font-size: 1.18rem; font-weight: 700; color: #fff; }
    .selected-date-count { font-size: 0.85rem; color: var(--accent-neon); font-weight: 600; }

    .race-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: var(--radius); padding: 22px; margin-bottom: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-top: 3px solid var(--accent-neon);
    }
    .race-card-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 14px; gap: 10px;
    }
    .race-card-title { font-size: 1.25rem; font-weight: 800; color: #fff; }
    .race-btn-link {
      background: #1e293b; color: var(--accent-blue); border: 1px solid #334155;
      padding: 5px 11px; border-radius: 6px; font-size: 0.78rem; text-decoration: none;
      font-weight: 600; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .race-btn-link:hover { background: #334155; }

    .meta-grid {
      display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 16px;
      background: rgba(0,0,0,0.22); padding: 14px; border-radius: 10px;
    }
    .meta-item { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; color: #cbd5e1; }
    .meta-item strong { color: var(--text-muted); min-width: 65px; font-weight: 500; font-size: 0.82rem; }

    /* 참가 등록 폼 */
    .vote-panel {
      background: #0d1526; border: 1px solid var(--border-color);
      border-radius: 10px; padding: 16px; margin-bottom: 20px;
    }
    .vote-panel h4 { font-size: 0.92rem; margin-bottom: 12px; color: #e2e8f0; }
    .vote-inputs { display: flex; flex-direction: column; gap: 10px; }
    .input-row { display: grid; grid-template-columns: 1.2fr 0.9fr 1fr; gap: 8px; }
    .vote-inputs input, .vote-inputs select {
      background: #1e293b; border: 1px solid #334155; color: #fff;
      padding: 9px 12px; border-radius: 8px; font-size: 0.88rem; outline: none;
    }
    .btn-submit-vote {
      background: var(--primary); color: #fff; font-weight: 700;
      border: none; padding: 10px; border-radius: 8px; cursor: pointer;
      font-size: 0.9rem; transition: background 0.2s;
    }
    .btn-submit-vote:hover { background: var(--primary-hover); }

    /* ================= 참가자 / 불참자 전용 분리 영역 ================= */
    .roster-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 10px;
    }

    .roster-section {
      border-radius: 10px;
      padding: 14px;
      border: 1px solid var(--border-color);
      background: rgba(13, 21, 38, 0.6);
    }
    .roster-section.attend-box {
      border-color: rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.04);
    }
    .roster-section.absent-box {
      border-color: rgba(244, 63, 94, 0.35);
      background: rgba(244, 63, 94, 0.04);
    }

    .roster-title {
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .roster-title.attend { color: #34d399; }
    .roster-title.absent { color: #fb7185; }

    .roster-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .roster-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111a2e;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.86rem;
    }
    .roster-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .roster-name { font-weight: 700; color: #fff; }
    .course-tag {
      background: rgba(163, 230, 53, 0.15);
      border: 1px solid var(--accent-neon);
      color: var(--accent-neon);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .roster-memo {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .btn-cancel {
      background: none; border: 1px solid #475569; color: #94a3b8;
      border-radius: 6px; padding: 3px 8px; font-size: 0.75rem; cursor: pointer;
      white-space: nowrap;
    }
    .btn-cancel:hover { background: rgba(244,63,94,0.15); border-color: var(--accent-coral); color: var(--accent-coral); }

    .empty-roster-msg {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      padding: 12px;
      font-style: italic;
    }

    /* 대회 추가 모달 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75); display: none; justify-content: center;
      align-items: center; z-index: 100; padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--card-bg); border: 1px solid var(--border-color);
      width: 100%; max-width: 500px; border-radius: var(--radius); padding: 24px;
    }
    .modal-box h3 { font-size: 1.2rem; margin-bottom: 16px; color: #fff; }
    .form-group { margin-bottom: 13px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
    .form-group input {
      width: 100%; background: #0f172a; border: 1px solid var(--border-color);
      color: #fff; padding: 9px 11px; border-radius: 8px; font-size: 0.88rem; outline: none;
    }
    .datetime-row { display: grid; grid-template-columns: 1.3fr 0.8fr 0.8fr; gap: 8px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-secondary { background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; }

    @media (min-width: 700px) {
      .roster-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .input-row { grid-template-columns: 1fr; }
      .cal-cell { min-height: 80px; padding: 4px; }
      .datetime-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <h1>🏃‍♂️ PACER RUNNING CLUB</h1>
      <p>구글 스프레드시트 연동 마라톤 대회 & 정기 훈련 매니저</p>
    </div>
    <div class="header-actions">
      <button class="btn-sync" onclick="loadData()">🔄 새로고침</button>
      <button class="btn-create" onclick="openCreateModal()">+ 새 일정 등록</button>
    </div>
  </header>

  <!-- 기능 선택 탭 (대회 vs 훈련) -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabRaces" onclick="switchTab('races')">🏅 마라톤 대회 참가 등록</button>
    <button class="tab-btn" id="tabSessions" onclick="switchTab('sessions')">🏃‍♂️ 정기 훈련 모임</button>
  </div>

  <!-- 동기화 상태 바 -->
  <div class="sync-bar">
    <div class="sync-status">
      <div class="sync-dot loading" id="syncDot"></div>
      <span id="syncText">스프레드시트 연결 중...</span>
    </div>
    <span id="syncTime"></span>
  </div>

  <!-- 1. 월간 달력 -->
  <section class="calendar-container">
    <div class="calendar-header">
      <div class="calendar-title" id="currentMonthLabel">달력 불러오는 중...</div>
      <div class="calendar-nav">
        <button onclick="changeMonth(-1)">◀ 이전달</button>
        <button class="btn-today" onclick="goToday()">오늘</button>
        <button onclick="changeMonth(1)">다음달 ▶</button>
      </div>
    </div>

    <div class="calendar-weekdays">
      <div class="weekday sun">일</div>
      <div class="weekday">월</div>
      <div class="weekday">화</div>
      <div class="weekday">수</div>
      <div class="weekday">목</div>
      <div class="weekday">금</div>
      <div class="weekday sat">토</div>
    </div>

    <div class="calendar-grid" id="calendarGrid">
      <!-- 달력 셀 동적 렌더링 -->
    </div>
  </section>

  <!-- 2. 선택된 날짜 상세 목록 (동일 날짜 복수 일정 순차 나열) -->
  <section id="detailSection">
    <div class="selected-date-header">
      <div class="selected-date-title" id="selectedDateTitle">📅 날짜를 선택해 주세요</div>
      <div class="selected-date-count" id="selectedDateCount"></div>
    </div>

    <div id="cardsContainer">
      <!-- 선택된 날짜의 대회/모임 목록 -->
    </div>
  </section>
</div>

<!-- 대회 등록 모달 -->
<div class="modal-overlay" id="createRaceModal">
  <div class="modal-box">
    <h3>새 마라톤 대회 등록</h3>
    <form id="createRaceForm" onsubmit="handleCreateRace(event)">
      <div class="form-group">
        <label>대회명</label>
        <input type="text" id="newRaceTitle" placeholder="예: 2026 서울 라이프마라톤" required>
      </div>
      <div class="form-group">
        <label>대회 개최 일시</label>
        <div class="datetime-row">
          <input type="date" id="newRaceDate" required>
          <select id="newRaceHour" required style="background:#0f172a; border:1px solid var(--border-color); color:#fff; border-radius:8px; padding:8px;"></select>
          <select id="newRaceMinute" required style="background:#0f172a; border:1px solid var(--border-color); color:#fff; border-radius:8px; padding:8px;">
            <option value="00">00분</option><option value="30">30분</option><option value="40">40분</option><option value="50">50분</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>개최 장소</label>
        <input type="text" id="newRaceLocation" placeholder="예: 상암 평화의공원 평화광장" required>
      </div>
      <div class="form-group">
        <label>종목/코스 (쉼표 구분)</label>
        <input type="text" id="newRaceCourse" placeholder="예: 풀코스, 하프코스, 10km, 5km" required>
      </div>
      <div class="form-group">
        <label>참가비 안내</label>
        <input type="text" id="newRaceFee" placeholder="예: 하프 50,000원 / 10K 45,000원">
      </div>
      <div class="form-group">
        <label>대회 공식 홈페이지 URL</label>
        <input type="url" id="newRaceHomepage" placeholder="https://...">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeCreateModal()">취소</button>
        <button type="submit" class="btn-primary" id="btnSaveRace">스프레드시트에 등록</button>
      </div>
    </form>
  </div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz47w3Sw6kFAnCTZNfA0kptkkWiPuTtrCvVIYQ8x2oPN_1kAldaAF7GJQswgU-iJkqP/exec";

  let currentTab = 'races'; // 'races' or 'sessions'
  let state = {
    races: [],
    raceAttendees: [],
    sessions: [],
    attendees: []
  };

  let currentNavDate = new Date();
  let selectedDateStr = formatDateKey(new Date());

  function formatDateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function parseDateKey(dtString) {
    if (!dtString) return '';
    const clean = String(dtString).trim();
    if (clean.length >= 10 && clean.includes('-')) {
      return clean.substring(0, 10);
    }
    const d = new Date(clean);
    if (!isNaN(d.getTime())) return formatDateKey(d);
    return '';
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabRaces').classList.toggle('active', tab === 'races');
    document.getElementById('tabSessions').classList.toggle('active', tab === 'sessions');
    renderCalendar();
    renderSelectedDateDetails();
  }

  async function loadData() {
    const dot = document.getElementById('syncDot');
    const text = document.getElementById('syncText');
    const timeSpan = document.getElementById('syncTime');

    dot.className = 'sync-dot loading';
    text.textContent = '스프레드시트와 실시간 동기화 중...';

    try {
      const response = await fetch(GAS_API_URL);
      const data = await response.json();
      state.races = data.races || [];
      state.raceAttendees = data.raceAttendees || [];
      state.sessions = data.sessions || [];
      state.attendees = data.attendees || [];

      dot.className = 'sync-dot online';
      text.textContent = `동기화 완료 (대회 ${state.races.length}개 / 훈련 ${state.sessions.length}회)`;
      timeSpan.textContent = new Date().toLocaleTimeString('ko-KR');

      if (currentTab === 'races' && state.races.length > 0) {
        const raceDates = state.races.map(r => parseDateKey(r.dateTime)).filter(Boolean).sort();
        const todayStr = formatDateKey(new Date());
        const upcoming = raceDates.find(d => d >= todayStr);
        if (upcoming) {
          selectedDateStr = upcoming;
          const [sy, sm] = upcoming.split('-');
          currentNavDate = new Date(parseInt(sy, 10), parseInt(sm, 10) - 1, 1);
        }
      }

      renderCalendar();
      renderSelectedDateDetails();
    } catch (err) {
      console.warn('동기화 오류:', err);
      dot.className = 'sync-dot';
      dot.style.background = 'var(--accent-coral)';
      text.textContent = '스프레드시트 응답 대기 중';
      renderCalendar();
      renderSelectedDateDetails();
    }
  }

  function getItemsMap() {
    const map = {};
    const list = currentTab === 'races' ? state.races : state.sessions;
    list.forEach(item => {
      const key = parseDateKey(item.dateTime);
      if (key) {
        if (!map[key]) map[key] = [];
        map[key].push(item);
      }
    });
    return map;
  }

  function renderCalendar() {
    const year = currentNavDate.getFullYear();
    const month = currentNavDate.getMonth();
    document.getElementById('currentMonthLabel').textContent = `${year}년 ${month + 1}월`;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const prevLastDate = new Date(year, month, 0).getDate();
    const todayStr = formatDateKey(new Date());
    const itemsMap = getItemsMap();

    for (let i = firstDay; i > 0; i--) {
      const d = prevLastDate - i + 1;
      const prevDate = new Date(year, month - 1, d);
      grid.appendChild(createCell(d, formatDateKey(prevDate), true, prevDate.getDay(), todayStr, itemsMap));
    }
    for (let d = 1; d <= lastDate; d++) {
      const thisDate = new Date(year, month, d);
      grid.appendChild(createCell(d, formatDateKey(thisDate), false, thisDate.getDay(), todayStr, itemsMap));
    }
    const totalCells = firstDay + lastDate;
    const nextDays = (7 - (totalCells % 7)) % 7;
    for (let d = 1; d <= nextDays; d++) {
      const nextDate = new Date(year, month + 1, d);
      grid.appendChild(createCell(d, formatDateKey(nextDate), true, nextDate.getDay(), todayStr, itemsMap));
    }
  }

  function createCell(dayNum, dateKey, isOtherMonth, dayOfWeek, todayStr, itemsMap) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (isOtherMonth) cell.classList.add('other-month');
    if (dayOfWeek === 0) cell.classList.add('sun');
    if (dayOfWeek === 6) cell.classList.add('sat');
    if (dateKey === todayStr) cell.classList.add('is-today');
    if (dateKey === selectedDateStr) cell.classList.add('selected');

    const dayItems = itemsMap[dateKey] || [];
    if (dayItems.length > 0) cell.classList.add('has-events');

    let badgeHtml = dayItems.length > 0 ? `<span class="event-badge-count">${dayItems.length}</span>` : '';
    
    let chipsHtml = '';
    if (dayItems.length > 0) {
      chipsHtml = `<div class="race-chip-list">` +
        dayItems.map(item => `
          <div class="race-mini-chip" title="${escapeHtml(item.title)}">
            ${currentTab === 'races' ? '🏅' : '🏃'} ${escapeHtml(item.title)}
          </div>
        `).join('') +
      `</div>`;
    }

    cell.innerHTML = `
      <div class="cell-top">
        <span class="cell-date">${dayNum}</span>
        ${badgeHtml}
      </div>
      ${chipsHtml}
    `;

    cell.onclick = () => {
      selectedDateStr = dateKey;
      renderCalendar();
      renderSelectedDateDetails();
    };

    return cell;
  }

  // 선택된 날짜 상세 렌더링 (참가자 영역 / 불참자 영역 분리)
  function renderSelectedDateDetails() {
    const container = document.getElementById('cardsContainer');
    const headerTitle = document.getElementById('selectedDateTitle');
    const headerCount = document.getElementById('selectedDateCount');

    const [y, m, d] = selectedDateStr.split('-').map(Number);
    const dateObj = new Date(y, m - 1, d);
    const dateFormatted = dateObj.toLocaleDateString('ko-KR', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
    });

    const isRaceMode = currentTab === 'races';
    headerTitle.innerHTML = `📅 <strong>${dateFormatted}</strong> ${isRaceMode ? '마라톤 대회' : '정기 훈련'} 목록`;

    const itemsMap = getItemsMap();
    const dayItems = itemsMap[selectedDateStr] || [];
    headerCount.textContent = `등록된 ${isRaceMode ? '대회' : '모임'}: ${dayItems.length}건`;

    if (dayItems.length === 0) {
      container.innerHTML = `
        <div style="text-align: center; padding: 40px 16px; color: var(--text-muted); background: var(--card-bg); border-radius: var(--radius); border: 1px dashed var(--border-color);">
          이 날짜에는 등록된 ${isRaceMode ? '마라톤 대회가' : '정기 훈련 모임이'} 없습니다.<br>
          <button class="btn-create" style="margin: 14px auto 0; font-size: 0.85rem;" onclick="openCreateModal('${selectedDateStr}')">+ 이 날짜에 새 일정 등록</button>
        </div>
      `;
      return;
    }

    if (isRaceMode) {
      // 대회 렌더링
      container.innerHTML = dayItems.map((race, idx) => {
        const attendees = state.raceAttendees.filter(a => String(a.raceId) === String(race.id));
        const attendList = attendees.filter(a => a.status === '참가' || a.status === 'attend');
        const absentList = attendees.filter(a => a.status === '불참' || a.status === 'absent');
        const courses = (race.course || '하프코스, 10km').split(',').map(c => c.trim());

        return `
          <div class="race-card">
            <div class="race-card-header">
              <div>
                <span style="font-size:0.75rem; color:var(--accent-neon); font-weight:700;">대회 #${idx + 1}</span>
                <h2 class="race-card-title">${escapeHtml(race.title)}</h2>
              </div>
              ${race.homepage ? `<a href="${race.homepage}" target="_blank" class="race-btn-link">🌐 대회 공식 홈페이지 ↗</a>` : ''}
            </div>

            <div class="meta-grid">
              <div class="meta-item"><strong>일시</strong> ⏰ ${escapeHtml(race.dateTime)}</div>
              <div class="meta-item"><strong>개최 장소</strong> 📍 ${escapeHtml(race.location)}</div>
              <div class="meta-item"><strong>참가 종목</strong> 🎽 ${escapeHtml(race.course)}</div>
              ${race.fee ? `<div class="meta-item"><strong>참가비</strong> 💳 ${escapeHtml(race.fee)}</div>` : ''}
            </div>

            <!-- 참가 신청/변경 폼 -->
            <div class="vote-panel">
              <h4>내 대회 참가 등록 / 변경</h4>
              <div class="vote-inputs">
                <div class="input-row">
                  <input type="text" id="name-${race.id}" placeholder="이름 (닉네임)" required>
                  <select id="course-${race.id}">
                    ${courses.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
                  </select>
                  <select id="status-${race.id}">
                    <option value="참가">🏃 참가</option>
                    <option value="불참">👋 불참</option>
                  </select>
                </div>
                <input type="text" id="memo-${race.id}" placeholder="목표 기록 및 메모 (예: 1시간 45분 완주 목표)">
                <button class="btn-submit-vote" onclick="submitRaceVote('${race.id}')">대회 참가 정보 저장</button>
              </div>
            </div>

            <!-- ★ 참가자 영역과 불참자 영역 분리 필드 ★ -->
            <div class="roster-grid">
              <!-- 1. 참가자 영역 -->
              <div class="roster-section attend-box">
                <div class="roster-title attend">
                  <span>🏃 참가자 명단</span>
                  <span>${attendList.length}명</span>
                </div>
                <div class="roster-list">
                  ${attendList.length === 0 ? `<div class="empty-roster-msg">등록된 참가자가 없습니다.</div>` : ''}
                  ${attendList.map(a => `
                    <div class="roster-item">
                      <div class="roster-left">
                        <span class="roster-name">${escapeHtml(a.name)}</span>${a.selectedCourse ? `<span class="course-tag">${escapeHtml(a.selectedCourse)}</span>` : ''}
                        ${a.memo ? `<span class="roster-memo">"${escapeHtml(a.memo)}"</span>` : ''}
                      </div>
                      <button class="btn-cancel" onclick="cancelRaceVote('${race.id}', '${escapeHtml(a.name)}')">취소</button>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- 2. 불참자 영역 -->
              <div class="roster-section absent-box">
                <div class="roster-title absent">
                  <span>👋 불참자 명단</span>
                  <span>${absentList.length}명</span>
                </div>
                <div class="roster-list">
                  ${absentList.length === 0 ? `<div class="empty-roster-msg">등록된 불참자가 없습니다.</div>` : ''}
                  ${absentList.map(a => `
                    <div class="roster-item">
                      <div class="roster-left">
                        <span class="roster-name">${escapeHtml(a.name)}</span>${a.memo ? `<span class="roster-memo">"${escapeHtml(a.memo)}"</span>` : ''}
                      </div>
                      <button class="btn-cancel" onclick="cancelRaceVote('${race.id}', '${escapeHtml(a.name)}')">취소</button>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

          </div>
        `;
      }).join('');
    } else {
      // 훈련 모임 렌더링
      container.innerHTML = dayItems.map(session => {
        const attendees = state.attendees.filter(a => String(a.sessionId) === String(session.id));
        const attendList = attendees.filter(a => a.status === 'attend' || a.status === '참석' || a.status === '참가');
        const absentList = attendees.filter(a => a.status === 'absent' || a.status === '불참');

        const sDateObj = new Date(session.dateTime);
        const timeStr = isNaN(sDateObj.getTime()) ? session.dateTime : sDateObj.toLocaleTimeString('ko-KR', {
          hour: '2-digit', minute: '2-digit'
        });

        return `
          <div class="race-card">
            <h2 class="race-card-title" style="margin-bottom:12px;">${escapeHtml(session.title)}</h2>
            <div class="meta-grid">
              <div class="meta-item"><strong>시간</strong> ⏰ ${timeStr}</div>
              <div class="meta-item"><strong>장소</strong> 📍 ${escapeHtml(session.location)}</div>
              <div class="meta-item"><strong>페이스</strong> ⚡ ${escapeHtml(session.pace)}</div>
              ${session.notice ? `<div class="meta-item"><strong>공지</strong> 📢 ${escapeHtml(session.notice)}</div>` : ''}
            </div>

            <!-- 참가 신청 폼 -->
            <div class="vote-panel">
              <h4>내 훈련 참가 등록 / 변경</h4>
              <div class="vote-inputs">
                <div class="input-row" style="grid-template-columns: 1.2fr 1fr;">
                  <input type="text" id="name-${session.id}" placeholder="이름 (닉네임)" required>
                  <select id="status-${session.id}">
                    <option value="attend">🏃 참석</option>
                    <option value="absent">👋 불참</option>
                  </select>
                </div>
                <input type="text" id="memo-${session.id}" placeholder="한줄 메모 (예: 5K만 달림)">
                <button class="btn-submit-vote" onclick="submitSessionVote('${session.id}')">훈련 참석 정보 저장</button>
              </div>
            </div>

            <!-- ★ 훈련 모임 참가자/불참자 분리 필드 ★ -->
            <div class="roster-grid">
              <div class="roster-section attend-box">
                <div class="roster-title attend">
                  <span>🏃 참석자 명단</span>
                  <span>${attendList.length}명</span>
                </div>
                <div class="roster-list">
                  ${attendList.length === 0 ? `<div class="empty-roster-msg">등록된 참석자가 없습니다.</div>` : ''}
                  ${attendList.map(a => `
                    <div class="roster-item">
                      <div class="roster-left">
                        <span class="roster-name">${escapeHtml(a.name)}</span>${a.memo ? `<span class="roster-memo">"${escapeHtml(a.memo)}"</span>` : ''}
                      </div>
                      <button class="btn-cancel" onclick="cancelSessionVote('${session.id}', '${escapeHtml(a.name)}')">취소</button>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="roster-section absent-box">
                <div class="roster-title absent">
                  <span>👋 불참자 명단</span>
                  <span>${absentList.length}명</span>
                </div>
                <div class="roster-list">
                  ${absentList.length === 0 ? `<div class="empty-roster-msg">등록된 불참자가 없습니다.</div>` : ''}
                  ${absentList.map(a => `
                    <div class="roster-item">
                      <div class="roster-left">
                        <span class="roster-name">${escapeHtml(a.name)}</span>${a.memo ? `<span class="roster-memo">"${escapeHtml(a.memo)}"</span>` : ''}
                      </div>
                      <button class="btn-cancel" onclick="cancelSessionVote('${session.id}', '${escapeHtml(a.name)}')">취소</button>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }
  }

  // 대회 참가 투표
  async function submitRaceVote(raceId) {
    const name = document.getElementById(`name-${raceId}`).value.trim();
    const course = document.getElementById(`course-${raceId}`).value;
    const status = document.getElementById(`status-${raceId}`).value;
    const memo = document.getElementById(`memo-${raceId}`).value.trim();

    if (!name) { alert('이름을 입력해 주세요.'); return; }

    try {
      await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'voteRaceAttendee',
          raceId: raceId,
          name: name,
          selectedCourse: course,
          status: status,
          memo: memo
        })
      });
      document.getElementById(`memo-${raceId}`).value = '';
      await loadData();
    } catch (err) {
      alert('참가 등록 중 오류가 발생했습니다: ' + err);
    }
  }

  // 대회 참가 취소
  async function cancelRaceVote(raceId, name) {
    if (!confirm(`'${name}' 님의 등록 내역을 취소하시겠습니까?`)) return;

    try {
      await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'cancelRaceAttendee',
          raceId: raceId,
          name: name
        })
      });
      await loadData();
    } catch (err) {
      alert('취소 처리 실패: ' + err);
    }
  }

  // 훈련 세션 투표
  async function submitSessionVote(sessionId) {
    const name = document.getElementById(`name-${sessionId}`).value.trim();
    const status = document.getElementById(`status-${sessionId}`).value;
    const memo = document.getElementById(`memo-${sessionId}`).value.trim();

    if (!name) { alert('이름을 입력해 주세요.'); return; }

    try {
      await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'voteAttendee',
          sessionId: sessionId,
          name: name,
          status: status,
          memo: memo
        })
      });
      document.getElementById(`memo-${sessionId}`).value = '';
      await loadData();
    } catch (err) {
      alert('저장 실패: ' + err);
    }
  }

  // 훈련 세션 취소
  async function cancelSessionVote(sessionId, name) {
    if (!confirm(`'${name}' 님의 등록 내역을 취소하시겠습니까?`)) return;

    try {
      await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'cancelAttendee',
          sessionId: sessionId,
          name: name
        })
      });
      await loadData();
    } catch (err) {
      alert('취소 실패: ' + err);
    }
  }

  // 대회 등록
  async function handleCreateRace(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSaveRace');
    btn.disabled = true;
    btn.innerText = '저장 중...';

    const dVal = document.getElementById('newRaceDate').value;
    const hVal = document.getElementById('newRaceHour').value;
    const mVal = document.getElementById('newRaceMinute').value;

    const newRace = {
      id: 'race_' + Date.now(),
      title: document.getElementById('newRaceTitle').value,
      dateTime: `${dVal} ${hVal}:${mVal}`,
      location: document.getElementById('newRaceLocation').value,
      course: document.getElementById('newRaceCourse').value,
      fee: document.getElementById('newRaceFee').value,
      homepage: document.getElementById('newRaceHomepage').value
    };

    try {
      await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'createRace', race: newRace })
      });
      closeCreateModal();
      document.getElementById('createRaceForm').reset();
      selectedDateStr = dVal;
      await loadData();
    } catch (err) {
      alert('대회 등록 실패: ' + err);
    } finally {
      btn.disabled = false;
      btn.innerText = '스프레드시트에 등록';
    }
  }

  function changeMonth(delta) {
    currentNavDate.setMonth(currentNavDate.getMonth() + delta);
    renderCalendar();
  }

  function goToday() {
    currentNavDate = new Date();
    selectedDateStr = formatDateKey(new Date());
    renderCalendar();
    renderSelectedDateDetails();
  }

  function openCreateModal(presetDate) {
    const hourSelect = document.getElementById('newRaceHour');
    hourSelect.innerHTML = '';
    for (let h = 6; h <= 18; h++) {
      const hStr = String(h).padStart(2, '0');
      const opt = document.createElement('option');
      opt.value = hStr;
      opt.textContent = `${hStr}시`;
      if (h === 8) opt.selected = true;
      hourSelect.appendChild(opt);
    }
    document.getElementById('newRaceDate').value = presetDate || selectedDateStr;
    document.getElementById('createRaceModal').classList.add('active');
  }

  function closeCreateModal() {
    document.getElementById('createRaceModal').classList.remove('active');
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  renderCalendar();
  loadData();
</script>

</body>
</html>
